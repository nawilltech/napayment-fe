name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx turbo run typecheck --filter=web
      - name: Lint
        run: npx turbo run lint --filter=web
      - name: Build
        env:
          NAWILL_API_BASE_URL: http://localhost:8080
        run: npx turbo run build --filter=web
