name: Deploy (reusable)

# Shared by deploy-dev.yml (and, later, deploy-prod.yml) so the actual deploy
# mechanics exist in exactly one place - mirrors app.nawill.ng's and
# napayment's .github/workflows/_deploy.yml. Not meant to be triggered
# directly.
on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      SSH_KEY:
        required: true
      APP_PATH:
        required: true
      WEB_ENV_FILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.APP_PATH }}"

            git fetch origin "${{ inputs.branch }}"
            git reset --hard "origin/${{ inputs.branch }}"

            # WEB_ENV_FILE is the full contents of apps/web/.env.local,
            # pasted in as one multi-line GitHub secret.
            cat > apps/web/.env.local <<'NAWILL_ENV_EOF'
            ${{ secrets.WEB_ENV_FILE }}
            NAWILL_ENV_EOF

            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
